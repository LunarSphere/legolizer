[project]
name = "legolizer"
version = "0.1.0"
description = "A proof-of-concept text-to-LDraw LEGO model builder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.49.0",
    "openai>=1.68.0",
    "pillow>=10.1",
    "pyldraw3>=1.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
legolizer = "legolizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legolizer"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # bugbear
]
ignore = [
    "E501", # line length handled by formatter / existing style
]

[tool.ruff.lint.isort]
known-first-party = ["legolizer"]
