[project]
name = "legolizer"
version = "0.1.0"
description = "A proof-of-concept text-to-LDraw LEGO model builder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.49.0",
    "openai>=1.68.0",
    "pillow>=10.1",
    "pyldraw3>=1.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
legolizer = "legolizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legolizer"]

[tool.uv]
package = true
