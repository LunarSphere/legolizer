name: Infra

on:
  pull_request:
    paths:
      - src/infra/**
      - src/legolizer/**
      - api/**
      - vercel.json
      - pyproject.toml
      - uv.lock
      - .github/workflows/infra.yml
  push:
    branches: [main]
    paths:
      - src/infra/**
      - src/legolizer/**
      - api/**
      - vercel.json
      - pyproject.toml
      - uv.lock
      - .github/workflows/infra.yml

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cdk:
    name: CDK synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/infra/cdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/infra/cdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run build

      - name: Synthesize (no AWS credentials)
        run: npx cdk synth --quiet -c imageTag=ci

  container:
    name: Docker workflow
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build image and run the local queue smoke test
        run: src/infra/scripts/validate-local.sh --keep

      - name: Container logs
        if: failure()
        run: docker compose -f src/infra/docker/compose.yaml logs --no-color || true
